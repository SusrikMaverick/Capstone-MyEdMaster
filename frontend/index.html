<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyEdMaster – Legal Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <div class="logo">M</div>
        <div class="brand-text">
          <h1>MyEdMaster</h1>
          <span>Legal Chatbot</span>
        </div>
      </div>
      <button class="btn-new" id="newChatBtn" title="New Chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <div class="main">
    <div class="header">
      <div class="header-left">
        <button class="btn-menu" id="menuBtn" title="Chat history">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="header-actions">

        <div class="mode-toggle">
          <span class="mode-label">Quick</span>

          <div class="toggle-switch" id="guidedToggle">
              <div class="toggle-knob"></div>
          </div>
          <span class="mode-label">Guided</span>
        </div>

        <div class="header-divider"></div>

        <div class="toggle-wrap" id="themeToggle" title="Toggle dark mode">
          <span class="icon icon-sun">&#9728;&#65039;</span>
          <span class="icon icon-moon">&#127769;</span>
        </div>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="empty-state">
        <div class="empty-icon">&#9878;</div>
        <p class="empty-title">Welcome to MyEdMaster Legal Chatbot</p>
        <p class="empty-sub">Ask any legal question about business or education topics to get started.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap" id="inputWrap">
        <button class="btn-mode" id="docToggle" title="Toggle PDF document generation mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </button>
        <textarea rows="1" placeholder="Ask anything" id="msgInput"></textarea>
        <span class="mode-hint" id="modeHint"></span>
        <button class="btn-send" id="sendBtn" title="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" stroke="none">
            <path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94l18-8.5a.75.75 0 0 0 0-1.38l-18-8.5Z"/>
          </svg>
        </button>
      </div>
      <div class="disclaimer">
        MyEdMaster provides general legal information &mdash; not formal legal advice.
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
